<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#334155" stop-opacity=".4"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(.95)}}@keyframes float{0%{transform:translateY(0)}}.glow-circle{animation:pulse 6s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8,8;animation:dash 25s linear infinite}.float-card{animation:float 5s ease-in-out infinite alternate}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><g opacity=".45"><circle cx="150" cy="100" r="140" fill="#38bdf8" class="glow-circle" filter="url(#glow)"/><circle cx="1050" cy="320" r="160" fill="#a855f7" class="glow-circle" filter="url(#glow)"/><circle cx="900" cy="80" r="100" fill="#6366f1" class="glow-circle" filter="url(#glow)"/></g><g fill="none" stroke="#60a5fa" stroke-o
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .glow-circle {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 25s linear infinite;
    }
    .node-pulse {
      animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .float-card {
      animation: float 5s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <g opacity="0.45">
    <circle class="glow-circle" cx="150" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="glow-circle" cx="1050" cy="320" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle class="glow-circle" cx="900" cy="80" r="100" fill="#6366f1" filter="url(#glow)" />
  </g>

  <!-- Dynamic Architectural Flow Lines (Background decoration) -->
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="2">
    <path class="flow-line" d="M 50,340 C 250,220 400,380 600,310 C 800,240 950,360 1150,260" />
    <path class="flow-line" d="M 80,100 C 300,60 500,160 750,90 C 950,30 1050,150 1160,110" />
  </g>

  <!-- Floating Portfolio Grid Icons / Architecture Nodes in Background -->
  <g class="float-card" opacity="0.3">
    <!-- Server Node -->
    <rect x="100" y="240" width="90" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="120" cy="260" r="4" fill="#38bdf8" />
    <circle cx="120" cy="280" r="4" fill="#22c55e" />
    <line x1="140" y1="260" x2="175" y2="260" stroke="#64748b" stroke-width="2" />
    <line x1="140" y1="280" x2="165" y2="280" stroke="#64748b" stroke-width="2" />

    <!-- Cloud Matrix Node -->
    <rect x="1020" y="140" width="100" height="70" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1045" cy="165" r="5" fill="#c084fc" />
    <circle cx="1075" cy="165" r="5" fill="#818cf8" />
    <line x1="1040" y1="185" x2="1100" y2="185" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- FOREGROUND: Content Card Backdrop to guarantee crisp readability -->
  <rect x="140" y="45" width="920" height="330" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" />

  <!-- Badges / Category Tag -->
  <g transform="translate(600, 90)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">ENTERPRISE ARCHITECTURE &amp; APM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="-0.5">
    Application Portfolio Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Curated Hub for Enterprise Architecture, SaaS Rationalization &amp; Catalog Governance
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: SaaS Pricing -->
    <g transform="translate(-320, 0)">
      <rect x="-90" y="-18" width="180" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">💰 SaaS Benchmark Pricing</text>
    </g>

    <!-- Pill 2: Open Source Tools -->
    <g transform="translate(-105, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ Open-Source Frameworks</text>
    </g>

    <!-- Pill 3: Market Dynamics -->
    <g transform="translate(110, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#pillGrad)" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">📊 Sector Market Dynamics</text>
    </g>

    <!-- Pill 4: Rationalization & TIME -->
    <g transform="translate(320, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🎯 TIME Rationalization</text>
    </g>
  </g>
</svg>
